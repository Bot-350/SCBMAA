services:
  - type: web
    name: scmaa
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    startCommand: gunicorn SCMAA.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: SCMAA.settings
