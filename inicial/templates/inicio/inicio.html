<!DOCTYPE html>
<html>
<head>
    <title>SCBMAA - Sistema de Aranceles</title>
    <style>
        :root {
            --primary-dark: #2c3e50;
            --primary-darker: #1a252f;
            --primary-medium: #34495e;
            --primary-light: #5d6d7e;
            --accent-blue: #3498db;
            --accent-teal: #1abc9c;
            --accent-orange: #e67e22;
            --accent-red: #e74c3c;
            --accent-green: #27ae60;
            --neutral-light: #ecf0f1;
            --neutral-medium: #bdc3c7;
            --neutral-dark: #95a5a6;
            --white: #ffffff;
            --shadow-light: rgba(44, 62, 80, 0.1);
            --shadow-medium: rgba(44, 62, 80, 0.2);
            --shadow-heavy: rgba(44, 62, 80, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-medium) 50%, var(--primary-light) 100%);
            min-height: 100vh;
            color: var(--primary-dark);
        }
        
        /* Barra superior */
        #top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: linear-gradient(90deg, var(--primary-darker) 0%, var(--primary-dark) 100%);
            z-index: 1001;
            display: flex;
            align-items: center;
            padding: 0 30px;
            box-shadow: 0 4px 20px var(--shadow-heavy);
            backdrop-filter: blur(10px);
        }
        
        #top-bar h1 {
            color: var(--white);
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px var(--shadow-medium);
        }
        
        /* Contenedor del usuario con menú desplegable */
        #user-container {
            margin-left: auto;
            position: relative;
        }
        
        #user-icon {
            color: white;  /* Fuerza el color blanco */
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background-color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: brightness(0) invert(1);  /* Convierte el emoji a blanco */
        }
        
        #user-icon:hover {
            background: var(--accent-teal);
            border-color: var(--white);
            transform: scale(1.1);
            box-shadow: 0 4px 15px var(--shadow-medium);
        }
        
        /* Menú desplegable */
        #user-dropdown {
            position: absolute;
            top: 120%;
            right: 0;
            background: var(--white);
            border: none;
            border-radius: 12px;
            box-shadow: 0 8px 32px var(--shadow-heavy);
            min-width: 180px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-20px);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1002;
            overflow: hidden;
        }
        
        #user-dropdown.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        
        #user-dropdown::before {
            content: '';
            position: absolute;
            top: -10px;
            right: 18px;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 10px solid var(--white);
        }
        
        .dropdown-item {
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            color: var(--primary-dark);
            text-decoration: none;
            font-weight: 500;
        }
        
        .dropdown-item:hover {
            background: linear-gradient(90deg, var(--neutral-light) 0%, rgba(52, 152, 219, 0.1) 100%);
            padding-left: 25px;
        }
        
        .dropdown-item:active {
            background: var(--accent-blue);
            color: var(--white);
        }
        
        .dropdown-item .icon {
            margin-right: 12px;
            font-size: 18px;
            width: 20px;
            text-align: center;
        }
        
        .logout-item {
            color: var(--accent-red);
            border-top: 1px solid var(--neutral-light);
        }
        
        .logout-item:hover {
            background: linear-gradient(90deg, rgba(231, 76, 60, 0.1) 0%, rgba(231, 76, 60, 0.2) 100%);
        }
        
        /* Indicador de carga para logout */
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
        
        .loading::after {
            content: '...';
            animation: loading-dots 1.5s infinite;
        }
        
        @keyframes loading-dots {
            0%, 20% { opacity: 0; }
            50% { opacity: 1; }
            80%, 100% { opacity: 0; }
        }
        
        /* Overlay para cerrar el menú desplegable */
        #dropdown-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            display: none;
            background: rgba(0, 0, 0, 0.1);
        }
        
        #dropdown-overlay.show {
            display: block;
        }
        
        /* Container principal */
        .main-container {
            margin-top: 70px;
            min-height: calc(100vh - 70px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }
        
        /* Título de bienvenida */
        .welcome-section {
            text-align: center;
            margin-bottom: 80px;
            animation: fadeInUp 1s ease-out;
        }
        
        .welcome-section h2 {
            font-size: 52px;
            color: var(--white);
            margin-bottom: 24px;
            text-shadow: 3px 3px 6px var(--shadow-heavy);
            font-weight: 300;
            letter-spacing: 2px;
        }
        
        .welcome-section .highlight {
            color: var(--accent-teal);
            font-weight: 600;
        }
        
        .welcome-section p {
            font-size: 22px;
            color: var(--neutral-light);
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.7;
            text-shadow: 1px 1px 3px var(--shadow-medium);
            font-weight: 300;
        }
        
        /* Contenedor de botones */
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-width: 550px;
            width: 100%;
            animation: fadeInUp 1s ease-out 0.3s both;
        }
        
        /* Estilos de botones */
        .main-button {
            background: var(--white);
            border: none;
            padding: 28px 45px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: 600;
            color: var(--primary-dark);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px var(--shadow-medium);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }
        
        .main-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.6s ease;
        }
        
        .main-button:hover::before {
            left: 100%;
        }
        
        .main-button:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 50px var(--shadow-heavy);
        }
        
        .main-button:active {
            transform: translateY(-4px) scale(0.98);
        }
        
        /* Colores específicos para cada botón */
        .button-arancel {
            border-left: 6px solid var(--accent-red);
        }
        
        .button-arancel:hover {
            background: linear-gradient(135deg, var(--white) 0%, rgba(231, 76, 60, 0.1) 100%);
            border-left-width: 8px;
        }
        
        .button-referencias {
            border-left: 6px solid var(--accent-orange);
        }
        
        .button-referencias:hover {
            background: linear-gradient(135deg, var(--white) 0%, rgba(230, 126, 34, 0.1) 100%);
            border-left-width: 8px;
        }
        
        .button-notas {
            border-left: 6px solid var(--accent-green);
        }
        
        .button-notas:hover {
            background: linear-gradient(135deg, var(--white) 0%, rgba(39, 174, 96, 0.1) 100%);
            border-left-width: 8px;
        }
        
        /* Iconos de los botones */
        .main-button i {
            margin-right: 18px;
            font-size: 28px;
            width: 35px;
            text-align: center;
        }
        
        .button-arancel i {
            color: var(--accent-red);
        }
        
        .button-referencias i {
            color: var(--accent-orange);
        }
        
        .button-notas i {
            color: var(--accent-green);
        }
        
        /* Animaciones */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Efectos de partículas de fondo mejorados */
        .background-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }
        
        .particle {
            position: absolute;
            border-radius: 50%;
            animation: float 8s ease-in-out infinite;
        }
        
        .particle:nth-child(1) {
            width: 24px;
            height: 24px;
            top: 15%;
            left: 10%;
            background: rgba(52, 152, 219, 0.3);
            animation-delay: 0s;
        }
        
        .particle:nth-child(2) {
            width: 18px;
            height: 18px;
            top: 45%;
            left: 85%;
            background: rgba(26, 188, 156, 0.4);
            animation-delay: 2s;
        }
        
        .particle:nth-child(3) {
            width: 30px;
            height: 30px;
            top: 75%;
            left: 15%;
            background: rgba(230, 126, 34, 0.3);
            animation-delay: 4s;
        }
        
        .particle:nth-child(4) {
            width: 22px;
            height: 22px;
            top: 25%;
            left: 75%;
            background: rgba(231, 76, 60, 0.3);
            animation-delay: 1s;
        }
        
        .particle:nth-child(5) {
            width: 16px;
            height: 16px;
            top: 65%;
            left: 65%;
            background: rgba(39, 174, 96, 0.4);
            animation-delay: 3s;
        }
        
        .particle:nth-child(6) {
            width: 20px;
            height: 20px;
            top: 85%;
            left: 45%;
            background: rgba(155, 89, 182, 0.3);
            animation-delay: 5s;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg) scale(1);
                opacity: 0.6;
            }
            25% {
                transform: translateY(-15px) rotate(90deg) scale(1.1);
                opacity: 0.8;
            }
            50% {
                transform: translateY(-25px) rotate(180deg) scale(1);
                opacity: 1;
            }
            75% {
                transform: translateY(-15px) rotate(270deg) scale(0.9);
                opacity: 0.8;
            }
        }
        
        /* Elementos decorativos adicionales */
        .geometric-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .shape {
            position: absolute;
            opacity: 0.1;
        }
        
        .shape-1 {
            width: 200px;
            height: 200px;
            background: linear-gradient(45deg, var(--accent-blue), var(--accent-teal));
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            top: 10%;
            right: 10%;
            animation: morphShape 12s ease-in-out infinite;
        }
        
        .shape-2 {
            width: 150px;
            height: 150px;
            background: linear-gradient(45deg, var(--accent-orange), var(--accent-red));
            border-radius: 50% 20% 80% 40%;
            bottom: 15%;
            left: 8%;
            animation: morphShape 15s ease-in-out infinite reverse;
        }
        
        @keyframes morphShape {
            0%, 100% {
                border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
                transform: rotate(0deg) scale(1);
            }
            25% {
                border-radius: 58% 42% 75% 25% / 76% 46% 54% 24%;
                transform: rotate(90deg) scale(1.1);
            }
            50% {
                border-radius: 50% 50% 33% 67% / 55% 27% 73% 45%;
                transform: rotate(180deg) scale(0.9);
            }
            75% {
                border-radius: 33% 67% 58% 42% / 63% 68% 32% 37%;
                transform: rotate(270deg) scale(1.05);
            }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            #top-bar {
                height: 60px;
                padding: 0 20px;
            }
            
            #top-bar h1 {
                font-size: 24px;
            }
            
            .main-container {
                margin-top: 60px;
                min-height: calc(100vh - 60px);
                padding: 40px 20px;
            }
            
            .welcome-section {
                margin-bottom: 60px;
            }
            
            .welcome-section h2 {
                font-size: 40px;
            }
            
            .welcome-section p {
                font-size: 18px;
                padding: 0 10px;
            }
            
            .buttons-container {
                padding: 0 10px;
                gap: 25px;
            }
            
            .main-button {
                padding: 22px 35px;
                font-size: 18px;
            }
        }
        
        @media (max-width: 480px) {
            .welcome-section h2 {
                font-size: 32px;
            }
            
            .main-button {
                padding: 20px 30px;
                font-size: 16px;
            }
            
            .main-button i {
                font-size: 24px;
                margin-right: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Overlay para cerrar el menú -->
    <div id="dropdown-overlay"></div>

    <!-- Barra superior -->
    <div id="top-bar">
        <h1>SCBMAA</h1>
        <div id="user-container">
            <div id="user-icon" style="color: white;">👤</div>
            <div id="user-dropdown">
                <div class="dropdown-item" id="config-btn">
                    <span class="icon">⚙️</span>
                    <span>Configuración</span>
                </div>
                {% if request.user.is_staff or request.user.is_superuser %}
                <a href="{% url 'usuarios:search_logs' %}" class="dropdown-item"><span class="icon">📊</span><span>Historial</span></a>
                {% endif %}
                <div class="dropdown-item logout-item" id="logout-btn">
                    <span class="icon">🚪</span>
                    <span>Cerrar Sesión</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Decoración de fondo -->
    <div class="background-decoration">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- Formas geométricas decorativas -->
    <div class="geometric-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <!-- Contenido principal -->
    <div class="main-container">
        <div class="welcome-section">
            <h2>Bienvenido a <span class="highlight">SCBMAA</span></h2>
            <p>Sistema integral de consulta arancelaria y clasificación de mercancías. Accede a toda la información que necesitas de manera rápida y eficiente.</p>
        </div>

        <div class="buttons-container">
            <button class="main-button button-arancel" onclick="goToArancel()">
                <i>📊</i>
                Arancel de Aduanas
            </button>
            
            <button class="main-button button-referencias" onclick="goToReferencias()">
                <i>🔍</i>
                Referencias de Clasificación
            </button>
            
            <button class="main-button button-notas" onclick="goToNotas()">
                <i>📝</i>
                Notas Explicativas
            </button>
        </div>
    </div>

    <script>
        // Funcionalidad del menú desplegable del usuario
        const userIcon = document.getElementById('user-icon');
        const userDropdown = document.getElementById('user-dropdown');
        const dropdownOverlay = document.getElementById('dropdown-overlay');
        const logoutBtn = document.getElementById('logout-btn');
        const configBtn = document.getElementById('config-btn');
        
        // Mostrar/ocultar menú desplegable
        userIcon.addEventListener('click', function(e) {
            e.stopPropagation();
            toggleDropdown();
        });
        
        // Cerrar menú al hacer clic en el overlay
        dropdownOverlay.addEventListener('click', function() {
            closeDropdown();
        });
        
        // Función para alternar el menú desplegable
        function toggleDropdown() {
            if (userDropdown.classList.contains('show')) {
                closeDropdown();
            } else {
                openDropdown();
            }
        }
        
        // Función para abrir el menú desplegable
        function openDropdown() {
            userDropdown.classList.add('show');
            dropdownOverlay.classList.add('show');
        }
        
        // Función para cerrar el menú desplegable
        function closeDropdown() {
            userDropdown.classList.remove('show');
            dropdownOverlay.classList.remove('show');
        }
        
        // Función para ir a la página de perfil/configuración
        function goToProfile() {
            window.location.href = "/perfil";
        }
        
        // Manejar el clic en configuración
        configBtn.addEventListener('click', function(e) {
            e.preventDefault();
            closeDropdown();
            goToProfile();
        });
        
        // Función para obtener cookies (útil para CSRF token)
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=1')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        
        // Función para limpiar datos de sesión del navegador
        function clearBrowserSession() {
            try {
                const cookies = document.cookie.split(";");
                for (let cookie of cookies) {
                    const eqPos = cookie.indexOf("=");
                    const name = eqPos > -1 ? cookie.substr(0, eqPos).trim() : cookie.trim();
                    
                    if (name.includes('session') || name.includes('csrf') || name.includes('auth')) {
                        document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
                        document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/;domain=" + window.location.hostname;
                    }
                }
                
                if (window.localStorage) {
                    const keysToRemove = [];
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        if (key && (key.includes('user') || key.includes('session') || key.includes('auth'))) {
                            keysToRemove.push(key);
                        }
                    }
                    keysToRemove.forEach(key => localStorage.removeItem(key));
                }
                
                if (window.sessionStorage) {
                    sessionStorage.clear();
                }
            } catch (error) {
                console.warn('No se pudieron limpiar todos los datos de sesión:', error);
            }
        }
        
        // Función para realizar logout
        async function performLogout() {
            try {
                logoutBtn.classList.add('loading');
                logoutBtn.querySelector('span:last-child').textContent = 'Cerrando sesión';
                
                const csrfToken = getCookie('csrftoken');
                
                const response = await fetch('/logout/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken,
                    },
                    credentials: 'same-origin'
                });
                
                if (response.ok) {
                    clearBrowserSession();
                    window.location.href = '/';
                } else {
                    throw new Error('Error en el servidor');
                }
                
            } catch (error) {
                console.error('Error durante el logout:', error);
                clearBrowserSession();
                alert('Se ha cerrado la sesión localmente. Por seguridad, cierre completamente el navegador.');
                window.location.href = '/';
            }
        }
        
        // Manejar el logout
        logoutBtn.addEventListener('click', function(e) {
            e.preventDefault();
            
            if (confirm('¿Estás seguro de que deseas cerrar sesión?')) {
                performLogout();
            }
            closeDropdown();
        });
        
        // Cerrar menú desplegable con Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeDropdown();
            }
        });

        // Funciones de navegacion
        function goToArancel() {
            window.location.href = "/aranceles/tabla/";
        }

        function goToReferencias() {
            console.log("Función no implementada aún");
        }

        function goToNotas() {
            console.log("Función no implementada aún");
        }

        // Efectos adicionales al cargar la página
        document.addEventListener('DOMContentLoaded', function() {
            const buttons = document.querySelectorAll('.main-button');
            
            buttons.forEach(button => {
                button.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-8px) scale(1.02)';
                });
                
                button.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateY(0) scale(1)';
                });
            });
        });

        // Crear partículas dinámicas mejoradas
        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'particle';
            
            const colors = [
                'rgba(52, 152, 219, 0.3)',
                'rgba(26, 188, 156, 0.3)',
                'rgba(230, 126, 34, 0.3)',
                'rgba(231, 76, 60, 0.3)',
                'rgba(39, 174, 96, 0.3)'
            ];
            
            const size = Math.random() * 25 + 15;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.background = colors[Math.floor(Math.random() * colors.length)];
            particle.style.animationDelay = Math.random() * 8 + 's';
            particle.style.animationDuration = (Math.random() * 6 + 6) + 's';
            
            document.querySelector('.background-decoration').appendChild(particle);
            
            setTimeout(() => {
                if (particle.parentNode) {
                    particle.parentNode.removeChild(particle);
                }
            }, 12000);
        }

        // Crear partículas adicionales periódicamente
        setInterval(createParticle, 4000);
        
        // Sistema de inactividad mejorado
        let inactivityTimer;
        const INACTIVITY_TIME = 30 * 60 * 1000; // 30 minutos
        
        function resetInactivityTimer() {
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                if (confirm('Tu sesión ha expirado por inactividad. ¿Deseas continuar?')) {
                    resetInactivityTimer();
                } else {
                    performLogout();
                }
            }, INACTIVITY_TIME);
        }
        
        ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart', 'click'].forEach(event => {
            document.addEventListener(event, resetInactivityTimer, true);
        });
        
        resetInactivityTimer();
    </script>
</body>
</html>
